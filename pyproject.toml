[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lab-agent"
version = "0.1.0"
description = "LORE — AI-powered lab assistant: fetches experiment data from GitHub and LabArchives, orchestrates report writing, and monitors dilution refrigerator conditions."
requires-python = ">=3.11"
dependencies = [
    # Pipeline core
    "python-dotenv",
    "pydantic>=2.0",
    "nbformat",
    "markdown",
    "Pillow",
    # Slack bot
    "slack-bolt",
    "slack-sdk",
    # LabArchives cookie refresh (headed browser login)
    "playwright",
    # Lab-specific packages
    # presto: not on PyPI — install from the bundled wheel first:
    #   pip install vendor/presto-2.16.0-py3-none-any.whl
    # daq: WashU internal wrapper around presto
    "daq @ git+https://github.com/WashU-Astroparticle-Lab/daq.git",
]

[project.optional-dependencies]
# Read session cookies from an installed browser instead of get_la_cookies.py
browser-cookies = ["browser-cookie3"]

[tool.setuptools.packages.find]
include = ["lab_agent*"]
